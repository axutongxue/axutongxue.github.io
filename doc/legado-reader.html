<script>
/* 代码块一键复制：给每个 pre 包一层 .doc-code 并挂复制按钮 */
(function () {
  var ICON_COPY = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 3.5H4A1.5 1.5 0 0 0 2.5 5v6"/></svg>';
  var ICON_OK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 8.5l3.5 3.5 7.5-8"/></svg>';
  function render(btn, ok) {
    btn.innerHTML = (ok ? ICON_OK : ICON_COPY) + '<span>' + (ok ? '已复制' : '复制') + '</span>';
    btn.classList.toggle('ok', ok);
  }
  function flash(btn, ok) {
    render(btn, ok);
    setTimeout(function () { render(btn, false); }, 1500);
  }
  function fallbackCopy(text, btn) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    flash(btn, ok);
  }
  document.querySelectorAll('#content pre').forEach(function (pre) {
    var wrap = document.createElement('div');
    wrap.className = 'doc-code';
    pre.parentNode.insertBefore(wrap, pre);
    wrap.appendChild(pre);
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'code-copy';
    btn.setAttribute('aria-label', '复制代码');
    render(btn, false);
    btn.addEventListener('click', function () {
      var text = pre.textContent;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(
          function () { flash(btn, true); },
          function () { fallbackCopy(text, btn); }
        );
      } else {
        fallbackCopy(text, btn);
      }
    });
    wrap.appendChild(btn);
  });
})();
</script>
